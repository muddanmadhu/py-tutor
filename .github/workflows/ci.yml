name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pyforge
          POSTGRES_PASSWORD: pyforge
          POSTGRES_DB: pyforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai]"

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        working-directory: backend
        run: mypy app

      - name: Test
        working-directory: backend
        env:
          PYFORGE_ENV: test
          PYFORGE_EXECUTOR: subprocess
          PYFORGE_SECRET_KEY: ci-only-secret-key-long-enough-for-validation
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Verify migrations apply cleanly
        working-directory: backend
        env:
          PYFORGE_DATABASE_URL: postgresql+psycopg://pyforge:pyforge@localhost:5432/pyforge_test
          PYFORGE_SECRET_KEY: ci-only-secret-key-long-enough-for-validation
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Verify the seed content loads
        working-directory: backend
        env:
          PYFORGE_DATABASE_URL: postgresql+psycopg://pyforge:pyforge@localhost:5432/pyforge_test
          PYFORGE_SECRET_KEY: ci-only-secret-key-long-enough-for-validation
        run: python -m app.db.init_db --seed

      # The exported content tree is committed, because static-site build images
      # cannot be relied on to have a usable Python. That trades a generation
      # step for a staleness risk, so the risk is closed here: re-export and
      # require the result to match what is committed.
      - name: Verify the exported content tree is current
        run: |
          python tools/export_static.py
          if ! git diff --quiet -- frontend/public/content; then
            echo "::error::frontend/public/content is stale. Run: python tools/export_static.py"
            git diff --stat -- frontend/public/content
            exit 1
          fi
          echo "content tree matches the curriculum"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  sandbox:
    name: Sandbox — container isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the runner image
        run: docker build -t pyforge/runner:latest ./runner

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run the Docker-isolation tests
        working-directory: backend
        env:
          PYFORGE_ENV: test
          PYFORGE_EXECUTOR: docker
          PYFORGE_SECRET_KEY: ci-only-secret-key-long-enough-for-validation
        run: pytest -m docker -v

  frontend:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - working-directory: frontend
        run: npm run lint

      - working-directory: frontend
        run: npm run typecheck

      - working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build the runner image
        run: docker build -t pyforge/runner:latest ./runner

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build db redis api web
          timeout 180 bash -c 'until curl -sf http://localhost:8000/health; do sleep 3; done'

      - name: Seed
        run: docker compose exec -T api python -m app.db.init_db --seed --demo

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

      - name: Dump API logs on failure
        if: failure()
        run: docker compose logs api
