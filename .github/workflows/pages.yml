name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# GITHUB_TOKEN needs to mint an OIDC token for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-progress one finish so Pages is not
# left serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check and lint
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint

      - name: Build
        working-directory: frontend
        env:
          # Where the Cloud Run API lives. Set as a repository *variable*
          # (Settings → Secrets and variables → Actions → Variables).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Firebase web config is public by design — it identifies the project,
          # it does not authorise anything. Access is controlled by Firebase
          # Auth rules and by the API verifying the ID token server-side.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Add SPA fallback and disable Jekyll
        working-directory: frontend
        run: |
          # Pages has no rewrite rules: a deep link like /Py-Tutor/learn/loops is
          # not a file, so Pages serves 404.html. Making that a copy of index.html
          # boots the same bundle and lets the router resolve the URL client-side.
          cp dist/index.html dist/404.html
          # Stop Pages running the output through Jekyll, which would drop any
          # path segment beginning with an underscore.
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
