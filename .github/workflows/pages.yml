name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs to mint an OIDC token for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-progress one finish so Pages is not
# left serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # No Python step: the content tree is committed, and ci.yml fails if it is
      # stale. That keeps this workflow identical in shape to the static hosts,
      # whose build images cannot be relied on to have a usable Python.
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and lint
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint

      # No VITE_API_BASE_URL: its absence is what selects the static
      # implementation in src/api/endpoints.ts.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Add SPA fallback and disable Jekyll
        working-directory: frontend
        run: |
          # Pages has no rewrite rules: a deep link like /py-tutor/learn/loops is
          # not a file, so Pages serves 404.html. Making that a copy of index.html
          # boots the same bundle and lets the router resolve the URL client-side.
          cp dist/index.html dist/404.html
          # Stop Pages running the output through Jekyll, which would drop any
          # path segment beginning with an underscore.
          touch dist/.nojekyll

      - name: Verify the content tree made it into the bundle
        working-directory: frontend
        run: |
          # A build that ships without content looks fine and then shows an empty
          # curriculum to every visitor, so fail here instead.
          test -f dist/content/courses.json
          test -f dist/content/grader.py
          test -f dist/content/reviewer.py
          echo "content files: $(find dist/content -type f | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
