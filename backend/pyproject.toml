[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyforge"
version = "0.1.0"
description = "PyForge — Python Engineering Mastery Platform backend"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # [email] pulls in email-validator, which EmailStr requires at class-build
    # time — without it every schema module fails to import.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "redis>=5.1",
]

[project.optional-dependencies]
ai = ["anthropic>=0.39"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-redis",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # import order
    "N",                # naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "RET",              # returns
    "ARG",              # unused arguments
    "PTH",              # pathlib
    "S",                # bandit security checks
    "D",                # docstrings
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "D107",   # __init__ documented on the class
    "S101",   # assert is fine in tests and invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S", "ARG"]
"app/content/*" = ["E501"]      # curriculum prose is long by nature
"alembic/*" = ["D", "N"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
exclude = ["^alembic/", "^tests/"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises the API against a real database",
    "docker: requires a working Docker daemon",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/content/*", "alembic/*"]
